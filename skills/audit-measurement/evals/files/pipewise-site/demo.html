<nav><a href="/">Pipewise</a> <a href="/product">Product</a> <a href="/customers">Customers</a> <a href="/demo" class="btn">Book a demo</a></nav>
<h1>Book a 20-minute demo</h1>
<form id="demo-form" action="/api/demo" method="post">
<label>Work email <input name="work_email" type="email" required></label>
<label>Full name <input name="full_name" required></label>
<label>Company <input name="company" required></label>
<label>Sales team size <select name="team_size" required><option value="1-10">1–10</option><option value="11-50">11–50</option><option value="51-200">51–200</option><option value="200+">200+</option></select></label>
<label>Phone (optional) <input name="phone" type="tel"></label>
<button type="submit">Book my demo</button>
</form>
<script>
document.getElementById("demo-form").addEventListener("submit", function (e) {
  e.preventDefault();
  var form = this;
  fetch("/api/demo", { method: "POST", body: new FormData(form) }).then(function (r) {
    if (r.ok) {
      gtag("event", "demo_requested", { form_id: "demo", team_size: form.team_size.value });
      form.outerHTML = "<p>Thanks, we'll email you within one business day to pick a time.</p>";
    }
  });
});
</script>
