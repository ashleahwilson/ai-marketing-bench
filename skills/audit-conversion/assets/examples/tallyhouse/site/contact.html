<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Book a free review | Tallyhouse</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TH12345"></script>
</head><body>
<h1>Book your free month-end review</h1>
<form action="/submit" method="post">
<input name="first_name" placeholder="First name" required><input name="last_name" placeholder="Last name" required>
<input name="email" type="email" required><input name="phone" required>
<input name="restaurant" placeholder="Restaurant name" required><input name="locations" placeholder="Number of locations" required>
<select name="pos"><option>Toast</option><option>Square</option><option>Lightspeed</option><option>Other</option></select>
<input name="revenue" placeholder="Annual revenue" required><input name="current_bookkeeper" placeholder="Current bookkeeper">
<textarea name="message"></textarea>
<button type="submit">Submit</button>
</form>
</body></html>
