<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Start your free trial | Quillmetrics</title>
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/forms.css">
<script src="https://cdn.quillmetrics.example/js/app.js"></script>
<script src="https://widget.chatbubble.example/loader.js"></script>
<script src="https://cdn.splitlab.example/ab.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QM55555"></script>
</head><body>
<a href="/"><img src="/img/logo.svg"></a>
<h1>Start your free trial</h1>
<form action="/api/signup" method="post" novalidate>
<input name="full_name" placeholder="Full name" required>
<input name="email" type="text" placeholder="Work email" required>
<input name="password" type="password" placeholder="Password" required>
<input name="store_url" placeholder="Shopify store URL" required>
<input name="phone" placeholder="Phone" required>
<select name="revenue" required><option value="">Annual revenue</option><option>Under $1M</option><option>$1M–$5M</option><option>$5M–$20M</option><option>Over $20M</option></select>
<input name="card_number" placeholder="Card number" required>
<input name="card_expiry" placeholder="MM/YY" required>
<input name="card_cvc" placeholder="CVC" required>
<button type="submit">Submit</button>
</form>
<p>Questions? <a href="mailto:hello@quillmetrics.example">Email us</a></p>
</body></html>
